<!DOCTYPE html>
<html>

<head>
    <title>Calculator</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .calculator {
            width: 500px;
            margin: auto;
            padding: 40px;
            border: 2px solid gray;
            border-radius: 5px;
        }

        input {
            display: block;
            width: 350px;
            padding: 12px;
            margin: 10px auto;
            font-size: 16px;
            border: 1px solid gray;
        }

        button {
            padding: 12px 25px;
            margin: 10px 5px;
            font-size: 18px;
            cursor: pointer;
            border: 1px solid gray;
            border-radius: 4px;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Calculator</h1>

        <input type="number" id="num1" placeholder="Enter first number">

        <input type="number" id="num2" placeholder="Enter second number">

        <button onclick="calculate('+')">+</button>
        <button onclick="calculate('-')">-</button>
        <button onclick="calculate('*')">*</button>
        <button onclick="calculate('/')">/</button>

        <h2>Result</h2>

        <h2 id="result">0</h2>

    </div>

    <script>
        function calculate(operator) {

            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);

            let result;

            if (operator === "+") {
                result = num1 + num2;
            }

            else if (operator === "-") {
                result = num1 - num2;
            }

            else if (operator === "*") {
                result = num1 * num2;
            }

            else if (operator === "/") {

                if (num2 === 0) {
                    result = "Cannot divide by zero";
                }

                else {
                    result = num1 / num2;
                }
            }

            document.getElementById("result").textContent = result;
        }
    </script>

</body>

</html>
